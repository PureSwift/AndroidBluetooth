name: Swift
on: [push]
jobs:

  android:
    name: Android
    strategy:
      fail-fast: false
      matrix:
        # Package manifests require swift-tools 6.3.
        swift: ['6.3.3']
        arch: ['aarch64', 'x86_64', 'armv7']
        sdk: ['28', '29', '31', '33']
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Java is required by android-commandlinetools (skip android sdk install)
      # and by the swift-java jextract plugin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: "Build Swift Package for Android"
        run: |
          brew install skiptools/skip/skip || (brew update && brew install skiptools/skip/skip)
          skip android sdk install --version ${{ matrix.swift }}
          ANDROID_NDK_ROOT="" ANDROID_SDK_VERSION=${{ matrix.sdk }} skip android build --arch ${{ matrix.arch }} --android-api-level ${{ matrix.sdk }}
